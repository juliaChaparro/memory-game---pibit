services:
  - type: web
    name: jogo-da-memoria-multiplayer
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./dev.db
      - key: FRONTEND_URL
        value: https://memory-game-pibit.vercel.app

  # Configuração do banco de dados PostgreSQL gratuito
  - type: postgres
    name: memory-game-db
    region: oregon
    plan: free
    databases:
      - name: memorygame
    autoDeploy: true # ← habilita deploy automático com git   